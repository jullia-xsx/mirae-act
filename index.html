<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirae MedAct | Jornada de Ativação</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root {
  --cream: #F8F7F4;
  --mist: #A8B8BB;
  --teal: #1A7A8E;
  --teal-lt: #22919E;
  --sage: #3D6470;
  --deep: #1B3F4E;
  --deep2: #142E3A;
  --gold: #D4A45A;
  --gold-lt: #E8C07A;
  --white: #FFFFFF;
  --border: rgba(168,184,187,.18);
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #DDE3E4;
  font-family: "DM Sans", sans-serif;
  -webkit-font-smoothing: antialiased;
  padding: 40px 16px 60px;
  display: flex;
  justify-content: center;
  min-height: 100vh;
}

.shell {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  background: var(--cream);
  border-radius: 12px;
  overflow: hidden;
  box-shadow: 0 4px 12px rgba(27,63,78,.04), 0 24px 60px rgba(27,63,78,.12);
  display: flex;
  flex-direction: column;
}

/* HERO */
.hero { background: var(--deep2); position: relative; overflow: hidden; }
.hero-bg {
  position: absolute; inset: 0;
  background:
    radial-gradient(ellipse 60% 50% at 100% 0%, rgba(26,122,142,.30) 0%, transparent 65%),
    radial-gradient(ellipse 40% 60% at 0% 100%, rgba(212,164,90,.10) 0%, transparent 60%),
    linear-gradient(160deg, #1B3F4E 0%, #142E3A 55%, #0F2229 100%);
}
.hero-grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 40%, transparent 100%);
}
.hero-inner { position: relative; z-index: 2; padding: 52px 64px 60px; }
.hero-topbar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 48px; padding-bottom: 22px;
  border-bottom: 1px solid rgba(255,255,255,.07);
}
.logo-wrap img { display: block; }
.tag-journey {
  display: flex; align-items: center; gap: 7px;
  background: rgba(212,164,90,.12);
  border: 1px solid rgba(212,164,90,.28);
  border-radius: 40px; padding: 6px 14px 6px 10px;
}
.tag-dot {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--gold);
  box-shadow: 0 0 8px rgba(212,164,90,.6);
  animation: pulse-dot 2s ease-in-out infinite;
}
@keyframes pulse-dot {
  0%,100% { opacity: 1; transform: scale(1); }
  50% { opacity: .5; transform: scale(.75); }
}
.tag-label { font-size: 10px; font-weight: 600; letter-spacing: 2px; text-transform: uppercase; color: var(--gold-lt); }
.hero-greeting { font-size: 14px; font-weight: 300; color: var(--mist); letter-spacing: .4px; margin-bottom: 4px; }
.hero-name { font-family: "Playfair Display", serif; font-size: 60px; font-weight: 700; color: var(--white); line-height: 1.0; letter-spacing: -1.5px; margin-bottom: 10px; }
.hero-subtitle { font-size: 16px; font-weight: 400; color: var(--gold-lt); letter-spacing: .2px; margin-bottom: 28px; }
.hero-desc { font-size: 14.5px; line-height: 1.75; color: var(--mist); font-weight: 300; max-width: 500px; opacity: .88; margin-bottom: 36px; }
.hero-desc strong { color: var(--white); font-weight: 500; }
.hero-rule { height: 2px; background: linear-gradient(90deg, transparent 0%, var(--gold) 30%, var(--teal-lt) 70%, transparent 100%); opacity: .45; }

/* QUOTE */
.quote-strip { background: var(--deep); padding: 32px 64px; position: relative; overflow: hidden; }
.quote-strip::before {
  content: "\201C"; position: absolute; left: 40px; top: 4px;
  font-family: "Playfair Display", serif; font-size: 80px;
  color: var(--gold); opacity: .15; line-height: 1; pointer-events: none;
}
.quote-strip::after {
  content: ""; position: absolute; right: 0; top: 0; bottom: 0; width: 3px;
  background: linear-gradient(180deg, var(--gold), var(--teal)); opacity: .35;
}
.quote-txt { font-family: "Playfair Display", serif; font-style: italic; font-size: 14.5px; color: var(--gold-lt); line-height: 1.8; text-align: center; padding: 0 20px; }

/* PROGRESS */
.progress-section { padding: 40px 64px 0; background: var(--cream); }
.section-eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--teal); margin-bottom: 6px; opacity: .7; }
.progress-head { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 14px; }
.progress-title { font-family: "Playfair Display", serif; font-size: 22px; font-weight: 600; color: var(--deep); letter-spacing: -.3px; }
.progress-badge { background: rgba(26,122,142,.1); border: 1px solid rgba(26,122,142,.2); border-radius: 40px; padding: 4px 12px; font-size: 11.5px; font-weight: 600; color: var(--teal); }
.seg-track { display: flex; gap: 4px; margin-bottom: 8px; }
.seg { flex: 1; height: 6px; border-radius: 99px; }
.seg.done { background: var(--teal); }
.seg.todo { background: rgba(168,184,187,.25); }
.seg-labels { display: flex; justify-content: space-between; }
.seg-pct { font-size: 11.5px; color: var(--sage); opacity: .6; }

/* STEPS */
.steps-section { padding: 36px 64px 44px; }
.steps-header {
  font-family: "Playfair Display", serif; font-size: 22px; font-weight: 600;
  color: var(--deep); margin-bottom: 28px; letter-spacing: -.3px;
  display: flex; align-items: center; gap: 12px;
}
.steps-header::after { content: ""; flex: 1; height: 1px; background: var(--border); }
.timeline { position: relative; }
.tl-line {
  position: absolute; left: 21px; top: 20px; width: 2px; bottom: 0;
  background: linear-gradient(180deg, var(--teal) 0%, rgba(26,122,142,.4) 30%, rgba(168,184,187,.15) 100%);
}
.step { display: flex; gap: 24px; margin-bottom: 20px; }
.step:last-child { margin-bottom: 0; }
.step-num {
  width: 44px; height: 44px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; font-weight: 700; flex-shrink: 0;
  position: relative; z-index: 1;
}
.step-num.s-active  { background: var(--teal); color: #fff; box-shadow: 0 0 0 6px rgba(26,122,142,.12), 0 4px 12px rgba(26,122,142,.3); }
.step-num.s-crucial { background: linear-gradient(135deg, var(--gold), #C8923A); color: #fff; box-shadow: 0 0 0 6px rgba(212,164,90,.12), 0 4px 12px rgba(212,164,90,.3); }
.step-num.s-pending { background: #FFFFFF; color: var(--mist); border: 2px solid rgba(168,184,187,.4); }
.step-num.s-done    { background: rgba(26,122,142,.12); color: var(--teal); border: 2px solid rgba(26,122,142,.3); font-size: 12px; }

.step-card {
  flex: 1; background: #FFFFFF; border-radius: 12px;
  border: 1px solid rgba(168,184,187,.25); padding: 24px 28px;
  position: relative; overflow: hidden;
  transition: box-shadow .2s, transform .2s;
}
.step-card:hover { box-shadow: 0 8px 28px rgba(27,63,78,.09); transform: translateY(-2px); }
.step-card.c-active { border-color: rgba(26,122,142,.3); }
.step-card.c-active::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--teal); border-radius: 12px 0 0 12px; }
.step-card.c-crucial { border-color: rgba(212,164,90,.35); background: linear-gradient(135deg, #fff 0%, rgba(212,164,90,.03) 100%); }
.step-card.c-crucial::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: linear-gradient(180deg, var(--gold), #C8923A); border-radius: 12px 0 0 12px; }
.step-card.c-done { opacity: .65; }

.card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 10px; }
.card-title { font-size: 16px; font-weight: 600; color: var(--deep); line-height: 1.3; }
.card-title.t-active  { color: var(--teal); }
.card-title.t-crucial { color: #8a5e1a; }
.card-title.t-done    { color: var(--mist); }
.badge { font-size: 10px; font-weight: 600; letter-spacing: 1.2px; text-transform: uppercase; padding: 4px 10px; border-radius: 4px; white-space: nowrap; flex-shrink: 0; }
.b-time    { background: rgba(168,184,187,.15); color: var(--sage); border: 1px solid rgba(168,184,187,.3); }
.b-crucial { background: rgba(212,164,90,.14); color: #8a5e1a; border: 1px solid rgba(212,164,90,.35); }
.b-active  { background: rgba(26,122,142,.1); color: var(--teal); border: 1px solid rgba(26,122,142,.25); }
.b-done    { background: rgba(26,122,142,.08); color: var(--teal); border: 1px solid rgba(26,122,142,.2); }

.card-desc { font-size: 14px; color: var(--sage); line-height: 1.65; font-weight: 300; margin-bottom: 18px; }
.alert { font-size: 13px; line-height: 1.65; padding: 12px 16px; border-radius: 8px; margin-bottom: 18px; }
.a-amber { background: rgba(212,164,90,.08); border: 1px solid rgba(212,164,90,.25); color: #7a5010; }
.a-teal  { background: rgba(26,122,142,.06); border: 1px solid rgba(26,122,142,.2); color: var(--deep); }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 10px 18px; border-radius: 7px;
  font-size: 13px; font-weight: 600; text-decoration: none;
  transition: all .18s; letter-spacing: .15px;
  cursor: pointer; border: none; font-family: "DM Sans", sans-serif;
}
.btn-primary { background: var(--teal); color: #fff; }
.btn-primary:hover { background: var(--deep); }
.btn-ghost { background: transparent; color: var(--sage); border: 1.5px solid rgba(61,100,112,.3); }
.btn-ghost:hover { border-color: var(--teal); color: var(--teal); }
.btn-ghost:disabled { opacity: .5; cursor: not-allowed; pointer-events: none; }
.btn-ghost.loading { background: rgba(26,122,142,.06); border-color: var(--teal); color: var(--teal); }
.btn-ghost.success { background: rgba(26,122,142,.1); border-color: var(--teal); color: var(--teal); pointer-events: none; }
.btn-ghost.error { border-color: #c0392b; color: #c0392b; }

/* Toast de feedback */
.toast {
  position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(80px);
  background: var(--deep); color: #fff; padding: 12px 22px; border-radius: 50px;
  font-size: 13px; font-weight: 500; z-index: 9999;
  box-shadow: 0 8px 32px rgba(0,0,0,.2);
  transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .35s;
  opacity: 0; white-space: nowrap;
}
.toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
.toast.toast-ok  { background: var(--teal); }
.toast.toast-err { background: #b03020; }

/* CTA */
.cta-section { margin: 0 64px 48px; background: var(--deep); border-radius: 16px; padding: 40px; position: relative; overflow: hidden; text-align: center; }
.cta-section::before { content: ""; position: absolute; top: -60px; right: -60px; width: 220px; height: 220px; border-radius: 50%; background: radial-gradient(circle, rgba(26,122,142,.3) 0%, transparent 70%); pointer-events: none; }
.cta-section::after  { content: ""; position: absolute; bottom: -40px; left: -40px; width: 160px; height: 160px; border-radius: 50%; background: radial-gradient(circle, rgba(212,164,90,.12) 0%, transparent 70%); pointer-events: none; }
.cta-inner { position: relative; z-index: 2; }
.cta-eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase; color: var(--gold); opacity: .75; margin-bottom: 10px; }
.cta-title { font-family: "Playfair Display", serif; font-size: 28px; font-weight: 700; color: var(--white); letter-spacing: -.4px; margin-bottom: 12px; line-height: 1.2; }
.cta-desc { font-size: 14px; color: var(--mist); font-weight: 300; line-height: 1.7; max-width: 400px; margin: 0 auto 28px; opacity: .85; }
.btn-wa {
  display: inline-flex; align-items: center; gap: 10px;
  background: var(--teal); color: #fff; font-size: 14px; font-weight: 600;
  padding: 14px 32px; border-radius: 50px; text-decoration: none; letter-spacing: .2px;
  box-shadow: 0 8px 28px rgba(26,122,142,.35); transition: all .2s;
  border: 1px solid rgba(255,255,255,.15);
}
.btn-wa:hover { background: var(--deep); transform: translateY(-2px); }

/* FOOTER */
.footer {
  background: var(--deep2); padding: 32px 64px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 8px; border-top: 1px solid rgba(255,255,255,.05);
  text-align: center; margin-top: auto;
}
.footer-tagline { font-size: 11px; font-weight: 300; color: var(--mist); letter-spacing: 1.5px; text-transform: uppercase; opacity: .5; margin-top: 4px; }

/* LOADING */
.loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 300px; gap: 16px; flex: 1; }
.spinner { width: 40px; height: 40px; border: 3px solid rgba(26,122,142,.2); border-top-color: var(--teal); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-txt { font-size: 14px; color: var(--sage); font-weight: 300; }

/* RESPONSIVE */
@media (max-width: 850px) {
  .hero-inner, .steps-section, .progress-section, .quote-strip { padding-left: 40px; padding-right: 40px; }
  .cta-section { margin: 0 40px 40px; }
  .hero-name { font-size: 48px; }
}
@media (max-width: 600px) {
  body { padding: 0; background: var(--cream); }
  .shell { border-radius: 0; box-shadow: none; min-height: 100vh; }
  .hero-inner, .steps-section, .progress-section, .quote-strip { padding-left: 20px; padding-right: 20px; }
  .hero-topbar { flex-direction: column; gap: 16px; align-items: flex-start; margin-bottom: 32px; padding-bottom: 16px; }
  .hero-name { font-size: 36px; }
  .progress-head { flex-direction: column; align-items: flex-start; gap: 8px; }
  .step { gap: 12px; }
  .step-num { width: 34px; height: 34px; font-size: 12px; }
  .tl-line { left: 16px; top: 20px; }
  .card-top { flex-direction: column; }
  .badge { margin-top: 4px; }
  .btn-row { flex-direction: column; width: 100%; gap: 8px; }
  .btn { width: 100%; justify-content: center; text-align: center; }
  .cta-section { margin: 0 16px 32px; padding: 28px 20px; }
  .btn-wa { width: 100%; justify-content: center; padding: 14px 20px; }
  .quote-txt { font-size: 14px; }
  .footer { padding: 24px 20px; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-txt">Carregando sua jornada...</div>
  </div>
  <div id="conteudo" style="display:none; flex-direction:column; flex:1;"></div>
</div>

<!-- Toast global -->
<div class="toast" id="toast"></div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyvCPtmYtdP-2XsV1_i-GPb42uOtSGstF_2w9oPtv25gcsls6AsuRwGkTU9vwQ-vER_/exec";

// ── Helpers ──────────────────────────────────────────────────
function wa(numero, msg) {
  return "https://wa.me/" + numero + "?text=" + encodeURIComponent(msg);
}

function showToast(msg, tipo) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast toast-' + tipo + ' show';
  setTimeout(function() { t.className = 'toast'; }, 3000);
}

// ── Confirmar etapa via POST → Apps Script ───────────────────
function concluirEtapa(etapaNum, nomeDoMedico, idMedico) {
  const btn = document.getElementById('btn-concluir-' + etapaNum);
  if (!btn || btn.disabled) return;

  btn.disabled = true;
  btn.className = 'btn btn-ghost loading';
  btn.innerHTML = '<span style="display:inline-block;width:12px;height:12px;border:2px solid rgba(26,122,142,.3);border-top-color:var(--teal);border-radius:50%;animation:spin .7s linear infinite;"></span> Salvando…';

  fetch(SCRIPT_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id: idMedico, etapa: etapaNum })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
    if (data.ok) {
      btn.className = 'btn btn-ghost success';
      btn.innerHTML = '✓ Etapa registrada!';
      showToast('✅ Etapa ' + etapaNum + ' concluída! Recarregando…', 'ok');
      setTimeout(function() { window.location.reload(); }, 1800);
    } else {
      btn.className = 'btn btn-ghost error';
      btn.innerHTML = '❌ Erro — tente novamente';
      btn.disabled = false;
      showToast('Erro ao registrar. Tente novamente.', 'err');
      setTimeout(function() {
        btn.className = 'btn btn-ghost';
        btn.innerHTML = '✅ Já concluí';
        btn.disabled = false;
      }, 3000);
    }
  })
  .catch(function() {
    btn.className = 'btn btn-ghost error';
    btn.innerHTML = '❌ Sem conexão';
    btn.disabled = false;
    showToast('Falha de conexão. Verifique sua internet.', 'err');
    setTimeout(function() {
      btn.className = 'btn btn-ghost';
      btn.innerHTML = '✅ Já concluí';
      btn.disabled = false;
    }, 3000);
  });
}

// ── Renderização principal ───────────────────────────────────
function renderizar(nome, etapa, id) {
  const segs = [1,2,3,4,5].map(function(n) {
    return '<div class="seg ' + (n <= etapa ? 'done' : 'todo') + '"></div>';
  }).join('');

  const pct = etapa * 20;

  // Botão "Já concluí" inteligente — dispara POST
  function btnConcluir(num) {
    return '<button id="btn-concluir-' + num + '" ' +
      'onclick="concluirEtapa(' + num + ', \'' + nome.replace(/'/g,"\\x27") + '\', \'' + id + '\')" ' +
      'class="btn btn-ghost">✅ Já concluí</button>';
  }

  const STEPS = [
    {
      num: 1,
      titulo: "Configuração e Diretrizes Iniciais",
      badge: "▶ Ativa agora", badgeClass: "b-active",
      numClass: "s-active", cardClass: "c-active", titleClass: "t-active",
      desc: "Alinhamento dos padrões assistenciais e política de relacionamento com a rede dr.consulta.",
      alerta: "",
      botoes:
        '<a href="https://canva.link/kikhw7k21wf7cwz" class="btn btn-primary">📖 Acessar Treinamento</a>' +
        btnConcluir(1)
    },
    {
      num: 2,
      titulo: "Certificação Digital (Bird ID)",
      badge: "⏱ 15 min", badgeClass: "b-time",
      numClass: "s-pending", cardClass: "", titleClass: "",
      desc: "Emissão gratuita da sua assinatura digital profissional via Soluti.",
      alerta: '<div class="alert a-amber"><strong>Instrução:</strong> O link de emissão foi enviado diretamente pela Soluti para o seu e-mail cadastrado.</div>',
      botoes:
        '<a href="https://mail.google.com/mail/u/0/#search/soluti" class="btn btn-primary">🔍 Procurar e-mail</a>' +
        btnConcluir(2)
    },
    {
      num: 3,
      titulo: "Integração Bird ID com S2",
      badge: "⚡ Crucial", badgeClass: "b-crucial",
      numClass: "s-crucial", cardClass: "c-crucial", titleClass: "t-crucial",
      desc: "Vínculo do seu Bird ID ao ecossistema S2 — etapa que desbloqueia o acesso ao sistema clínico.",
      alerta: '<div class="alert a-teal"><strong>Ação Necessária:</strong> Após emitir o Bird ID, sinalize a equipe dr.consulta pelo WhatsApp para iniciar a integração imediatamente.</div>',
      botoes:
        '<a href="' + wa("5511996510617", "Olá, acabei de emitir o Bird ID e preciso iniciar a integração com o S2. Médico: " + nome) + '" class="btn btn-primary">💬 Falar no WhatsApp</a>' +
        btnConcluir(3)
    },
    {
      num: 4,
      titulo: "Treinamento Online S2",
      badge: "⏱ 40 min", badgeClass: "b-time",
      numClass: "s-pending", cardClass: "", titleClass: "",
      desc: "Treinamento online completo do sistema S2 para dominar a plataforma antes do início das consultas.",
      alerta: "",
      botoes:
        '<a href="' + wa("5511996510617", "Olá, gostaria de agendar o treinamento online do S2. Médico: " + nome) + '" class="btn btn-primary">📅 Agendar Treinamento</a>' +
        btnConcluir(4)
    },
    {
      num: 5,
      titulo: "Onboarding Presencial",
      badge: "⏱ 1h30", badgeClass: "b-time",
      numClass: "s-pending", cardClass: "", titleClass: "",
      desc: "Encontro com a Diretoria Médica para validação final e liberação da sua agenda de atendimentos.",
      alerta: "",
      botoes:
        '<a href="' + wa("5511996510617", "Olá, gostaria de agendar o Onboarding Presencial com a Diretoria Médica. Médico: " + nome) + '" class="btn btn-primary">📅 Agendar Onboarding</a>' +
        btnConcluir(5)
    }
  ];

  const stepsHTML = STEPS.map(function(s) {
    const concluido = s.num < etapa;
    const nClass   = concluido ? "s-done"  : s.numClass;
    const cClass   = concluido ? "c-done"  : s.cardClass;
    const tClass   = concluido ? "t-done"  : s.titleClass;
    const bHTML    = concluido
      ? '<span class="badge b-done">✓ Concluído</span>'
      : '<span class="badge ' + s.badgeClass + '">' + s.badge + '</span>';
    const numLabel = concluido ? "✓" : s.num;
    const btnBlock = concluido ? '' : '<div class="btn-row">' + s.botoes + '</div>';
    return [
      '<div class="step">',
      '<div class="step-num ' + nClass + '">' + numLabel + '</div>',
      '<div class="step-card ' + cClass + '">',
      '<div class="card-top"><div class="card-title ' + tClass + '">' + s.titulo + '</div>' + bHTML + '</div>',

function erro(msg) {
  document.getElementById('loading').innerHTML =
    '<p style="font-family:sans-serif;padding:40px;color:#3D6470;">' + msg + '</p>';
}

// ── Bootstrap ────────────────────────────────────────────────
const params = new URLSearchParams(window.location.search);
const id = params.get('id');

if (!id) {
  erro('Link inválido. Solicite um novo link à equipe Mirae.');
} else {
  fetch(SCRIPT_URL + '?id=' + encodeURIComponent(id))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.erro) {
        erro(data.erro);
      } else {
        renderizar(data.nome, data.etapa, id);
      }
    })
    .catch(function() {
      erro('Erro ao carregar. Tente novamente ou fale com a equipe Mirae.');
    });
}
