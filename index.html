<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mirae MedAct | Jornada de Ativação</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
<style>
:root{--cream:#F8F7F4;--mist:#A8B8BB;--teal:#1A7A8E;--teal-lt:#22919E;--sage:#3D6470;--deep:#1B3F4E;--deep2:#142E3A;--gold:#D4A45A;--gold-lt:#E8C07A;--white:#FFFFFF;--border:rgba(168,184,187,.18);}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#DDE3E4;font-family:"DM Sans",sans-serif;-webkit-font-smoothing:antialiased;padding:40px 16px 60px;}
.shell{max-width:640px;margin:0 auto;background:var(--cream);border-radius:6px;overflow:hidden;box-shadow:0 2px 4px rgba(27,63,78,.04),0 12px 40px rgba(27,63,78,.12),0 32px 80px rgba(27,63,78,.10);}
.hero{background:var(--deep2);position:relative;overflow:hidden;}
.hero-bg{position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 100% 0%,rgba(26,122,142,.30) 0%,transparent 65%),radial-gradient(ellipse 40% 60% at 0% 100%,rgba(212,164,90,.10) 0%,transparent 60%),linear-gradient(160deg,#1B3F4E 0%,#142E3A 55%,#0F2229 100%);}
.hero-grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(ellipse 80% 80% at 50% 50%,black 40%,transparent 100%);}
.hero-inner{position:relative;z-index:2;padding:44px 52px 52px;}
.hero-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:48px;padding-bottom:22px;border-bottom:1px solid rgba(255,255,255,.07);}
.logo-wrap img{display:block;}
.tag-journey{display:flex;align-items:center;gap:7px;background:rgba(212,164,90,.12);border:1px solid rgba(212,164,90,.28);border-radius:40px;padding:6px 14px 6px 10px;}
.tag-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);box-shadow:0 0 8px rgba(212,164,90,.6);animation:pulse-dot 2s ease-in-out infinite;}
@keyframes pulse-dot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(.75)}}
.tag-label{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--gold-lt);}
.hero-greeting{font-size:13px;font-weight:300;color:var(--mist);letter-spacing:.4px;margin-bottom:4px;}
.hero-name{font-family:"Playfair Display",serif;font-size:52px;font-weight:700;color:var(--white);line-height:1.0;letter-spacing:-1.5px;margin-bottom:10px;}
.hero-subtitle{font-size:15px;font-weight:400;color:var(--gold-lt);letter-spacing:.2px;margin-bottom:28px;}
.hero-desc{font-size:13.5px;line-height:1.75;color:var(--mist);font-weight:300;max-width:430px;opacity:.88;margin-bottom:36px;}
.hero-desc strong{color:var(--white);font-weight:500;}
.hero-rule{height:2px;background:linear-gradient(90deg,transparent 0%,var(--gold) 30%,var(--teal-lt) 70%,transparent 100%);opacity:.45;}
.quote-strip{background:var(--deep);padding:26px 52px;position:relative;overflow:hidden;}
.quote-strip::before{content:"\201C";position:absolute;left:40px;top:4px;font-family:"Playfair Display",serif;font-size:80px;color:var(--gold);opacity:.15;line-height:1;pointer-events:none;}
.quote-strip::after{content:"";position:absolute;right:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),var(--teal));opacity:.35;}
.quote-txt{font-family:"Playfair Display",serif;font-style:italic;font-size:13.5px;color:var(--gold-lt);line-height:1.8;text-align:center;padding:0 20px;opacity:1;}
.progress-section{padding:32px 52px 0;background:var(--cream);}
.section-eyebrow{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--teal);margin-bottom:6px;opacity:.7;}
.progress-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:14px;}
.progress-title{font-family:"Playfair Display",serif;font-size:19px;font-weight:600;color:var(--deep);letter-spacing:-.3px;}
.progress-badge{background:rgba(26,122,142,.1);border:1px solid rgba(26,122,142,.2);border-radius:40px;padding:4px 12px;font-size:11.5px;font-weight:600;color:var(--teal);}
.seg-track{display:flex;gap:4px;margin-bottom:8px;}
.seg{flex:1;height:5px;border-radius:99px;}
.seg.done{background:var(--teal);}
.seg.todo{background:rgba(168,184,187,.25);}
.seg-labels{display:flex;justify-content:space-between;}
.seg-pct{font-size:10.5px;color:var(--sage);opacity:.6;}
.steps-section{padding:28px 52px 36px;}
.steps-header{font-family:"Playfair Display",serif;font-size:20px;font-weight:600;color:var(--deep);margin-bottom:24px;letter-spacing:-.3px;display:flex;align-items:center;gap:12px;}
.steps-header::after{content:"";flex:1;height:1px;background:var(--border);}
.timeline{position:relative;}
.tl-line{position:absolute;left:19px;top:20px;width:1px;bottom:0;background:linear-gradient(180deg,var(--teal) 0%,rgba(26,122,142,.4) 30%,rgba(168,184,187,.15) 100%);}
.step{display:flex;gap:20px;margin-bottom:16px;}
.step:last-child{margin-bottom:0;}
.step-num{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;position:relative;z-index:1;}
.step-num.s-active{background:var(--teal);color:#fff;box-shadow:0 0 0 5px rgba(26,122,142,.12),0 4px 12px rgba(26,122,142,.3);}
.step-num.s-crucial{background:linear-gradient(135deg,var(--gold),#C8923A);color:#fff;box-shadow:0 0 0 5px rgba(212,164,90,.12),0 4px 12px rgba(212,164,90,.3);}
.step-num.s-pending{background:#FFFFFF;color:var(--mist);border:1.5px solid rgba(168,184,187,.4);}
.step-num.s-done{background:rgba(26,122,142,.12);color:var(--teal);border:1.5px solid rgba(26,122,142,.3);font-size:11px;}
.step-card{flex:1;background:#FFFFFF;border-radius:12px;border:1px solid rgba(168,184,187,.25);padding:20px 22px;position:relative;overflow:hidden;transition:box-shadow .2s,transform .2s;}
.step-card:hover{box-shadow:0 8px 28px rgba(27,63,78,.09);transform:translateY(-1px);}
.step-card.c-active{border-color:rgba(26,122,142,.3);}
.step-card.c-active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--teal);border-radius:12px 0 0 12px;}
.step-card.c-crucial{border-color:rgba(212,164,90,.35);background:linear-gradient(135deg,#fff 0%,rgba(212,164,90,.03) 100%);}
.step-card.c-crucial::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--gold),#C8923A);border-radius:12px 0 0 12px;}
.step-card.c-done{opacity:.55;}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:8px;}
.card-title{font-size:14.5px;font-weight:600;color:var(--deep);line-height:1.3;}
.card-title.t-active{color:var(--teal);}
.card-title.t-crucial{color:#8a5e1a;}
.card-title.t-done{color:var(--mist);}
.badge{font-size:9.5px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;padding:3px 9px;border-radius:4px;white-space:nowrap;flex-shrink:0;}
.b-time{background:rgba(168,184,187,.15);color:var(--sage);border:1px solid rgba(168,184,187,.3);}
.b-crucial{background:rgba(212,164,90,.14);color:#8a5e1a;border:1px solid rgba(212,164,90,.35);}
.b-active{background:rgba(26,122,142,.1);color:var(--teal);border:1px solid rgba(26,122,142,.25);}
.b-done{background:rgba(26,122,142,.08);color:var(--teal);border:1px solid rgba(26,122,142,.2);}
.card-desc{font-size:13px;color:var(--sage);line-height:1.65;font-weight:300;margin-bottom:16px;}
.alert{font-size:12.5px;line-height:1.65;padding:11px 14px;border-radius:8px;margin-bottom:16px;}
.a-amber{background:rgba(212,164,90,.08);border:1px solid rgba(212,164,90,.25);color:#7a5010;}
.a-teal{background:rgba(26,122,142,.06);border:1px solid rgba(26,122,142,.2);color:var(--deep);}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:7px;font-size:12.5px;font-weight:600;text-decoration:none;transition:all .18s;letter-spacing:.15px;}
.btn-primary{background:var(--teal);color:#fff;}
.btn-primary:hover{background:var(--deep);}
.btn-ghost{background:transparent;color:var(--sage);border:1.5px solid rgba(61,100,112,.3);}
.btn-ghost:hover{border-color:var(--teal);color:var(--teal);}
.cta-section{margin:0 52px 40px;background:var(--deep);border-radius:16px;padding:36px;position:relative;overflow:hidden;text-align:center;}
.cta-section::before{content:"";position:absolute;top:-60px;right:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(26,122,142,.3) 0%,transparent 70%);pointer-events:none;}
.cta-section::after{content:"";position:absolute;bottom:-40px;left:-40px;width:160px;height:160px;border-radius:50%;background:radial-gradient(circle,rgba(212,164,90,.12) 0%,transparent 70%);pointer-events:none;}
.cta-inner{position:relative;z-index:2;}
.cta-eyebrow{font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;color:var(--gold);opacity:.75;margin-bottom:10px;}
.cta-title{font-family:"Playfair Display",serif;font-size:24px;font-weight:700;color:var(--white);letter-spacing:-.4px;margin-bottom:10px;line-height:1.2;}
.cta-desc{font-size:13px;color:var(--mist);font-weight:300;line-height:1.7;max-width:340px;margin:0 auto 26px;opacity:.85;}
.btn-wa{display:inline-flex;align-items:center;gap:10px;background:var(--teal);color:#fff;font-size:14px;font-weight:600;padding:14px 30px;border-radius:50px;text-decoration:none;letter-spacing:.2px;box-shadow:0 8px 28px rgba(26,122,142,.35);transition:all .2s;border:1px solid rgba(255,255,255,.15);}
.btn-wa:hover{background:var(--deep);transform:translateY(-2px);}
.footer{background:var(--deep2);padding:28px 52px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border-top:1px solid rgba(255,255,255,.05);text-align:center;}
.footer-tagline{font-size:10.5px;font-weight:300;color:var(--mist);letter-spacing:1.5px;text-transform:uppercase;opacity:.5;margin-top:4px;}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:300px;gap:16px;}
.spinner{width:36px;height:36px;border:3px solid rgba(26,122,142,.2);border-top-color:var(--teal);border-radius:50%;animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-txt{font-size:13px;color:var(--sage);font-weight:300;}
@media(max-width:540px){.hero-inner,.steps-section,.progress-section,.quote-strip{padding-left:24px;padding-right:24px;}.hero-name{font-size:38px;}.cta-section{margin:0 24px 32px;padding:28px 24px;}.footer{padding:20px 24px;}}
</style>
</head>
<body>
<div class="shell">
  <div class="loading" id="loading">
    <div class="spinner"></div>
    <div class="loading-txt">Carregando sua jornada...</div>
  </div>
  <div id="conteudo" style="display:none"></div>
</div>

<script>
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyqaZlmbA7iFM4jocdRdW2eifFxlCV5YDrUawgdf1TswX3myfg7e7gclzfZ6Ogmz1Cq/exec";

function wa(numero, msg) {
  return "https://wa.me/" + numero + "?text=" + encodeURIComponent(msg);
}

function renderizar(nome, etapa) {
  const segs = [1,2,3,4,5].map(function(n) {
    return '<div class="seg ' + (n <= etapa ? 'done' : 'todo') + '"></div>';
  }).join('');

  const pct = etapa * 20;

  const STEPS = [
    {
      num: 1,
      titulo: "Configuração e Diretrizes Iniciais",
      badge: "▶ Ativa agora", badgeClass: "b-active",
      numClass: "s-active", cardClass: "c-active", titleClass: "t-active",
      desc: "Alinhamento dos padrões assistenciais e política de relacionamento com a rede dr.consulta.",
      alerta: "",
      botoes:
        '<a href="https://canva.link/kikhw7k21wf7cwz" class="btn btn-primary">📖 Acessar Treinamento</a>' +
        '<a href="' + wa("5511915161138", "Olá, já concluí a Etapa 1 — Configuração e Diretrizes Iniciais. Médico: " + nome) + '" class="btn btn-ghost">✅ Já concluí</a>'
    },
    {
      num: 2,
      titulo: "Certificação Digital (Bird ID)",
      badge: "⏱ 15 min", badgeClass: "b-time",
      numClass: "s-pending", cardClass: "", titleClass: "",
      desc: "Emissão gratuita da sua assinatura digital profissional via Soluti.",
      alerta: '<div class="alert a-amber"><strong>Instrução:</strong> O link de emissão foi enviado diretamente pela Soluti para o seu e-mail cadastrado.</div>',
      botoes:
        '<a href="https://mail.google.com/mail/u/0/#search/soluti" class="btn btn-primary">🔍 Procurar e-mail</a>' +
        '<a href="' + wa("5511915161138", "Olá, já concluí a Etapa 2 — Certificação Digital (Bird ID). Médico: " + nome) + '" class="btn btn-ghost">✅ Já concluí</a>'
    },
    {
      num: 3,
      titulo: "Integração Bird ID com S2",
      badge: "⚡ Crucial", badgeClass: "b-crucial",
      numClass: "s-crucial", cardClass: "c-crucial", titleClass: "t-crucial",
      desc: "Vínculo do seu Bird ID ao ecossistema S2 — etapa que desbloqueia o acesso ao sistema clínico.",
      alerta: '<div class="alert a-teal"><strong>Ação Necessária:</strong> Após emitir o Bird ID, sinalize a equipe dr.consulta pelo WhatsApp para iniciar a integração imediatamente.</div>',
      botoes:
        '<a href="' + wa("5511996510617", "Olá, acabei de emitir o Bird ID e preciso iniciar a integração com o S2. Médico: " + nome) + '" class="btn btn-primary">💬 Falar no WhatsApp</a>' +
        '<a href="' + wa("5511915161138", "Olá, já concluí a Etapa 3 — Integração Bird ID com S2. Médico: " + nome) + '" class="btn btn-ghost">✅ Já concluí</a>'
    },
    {
      num: 4,
      titulo: "Treinamento Online S2",
      badge: "⏱ 40 min", badgeClass: "b-time",
      numClass: "s-pending", cardClass: "", titleClass: "",
      desc: "Treinamento online completo do sistema S2 para dominar a plataforma antes do início das consultas.",
      alerta: "",
      botoes:
        '<a href="' + wa("5511996510617", "Olá, gostaria de agendar o treinamento online do S2. Médico: " + nome) + '" class="btn btn-primary">📅 Agendar Treinamento</a>' +
        '<a href="' + wa("5511915161138", "Olá, já concluí a Etapa 4 — Treinamento Online S2. Médico: " + nome) + '" class="btn btn-ghost">✅ Já concluí</a>'
    },
    {
      num: 5,
      titulo: "Onboarding Presencial",
      badge: "⏱ 1h30", badgeClass: "b-time",
      numClass: "s-pending", cardClass: "", titleClass: "",
      desc: "Encontro com a Diretoria Médica para validação final e liberação da sua agenda de atendimentos.",
      alerta: "",
      botoes:
        '<a href="' + wa("5511996510617", "Olá, gostaria de agendar o Onboarding Presencial com a Diretoria Médica. Médico: " + nome) + '" class="btn btn-primary">📅 Agendar Onboarding</a>'
    }
  ];

  const stepsHTML = STEPS.map(function(s) {
    const concluido = s.num < etapa;
    const nClass   = concluido ? "s-done"  : s.numClass;
    const cClass   = concluido ? "c-done"  : s.cardClass;
    const tClass   = concluido ? "t-done"  : s.titleClass;
    const bHTML    = concluido
      ? '<span class="badge b-done">✓ Concluído</span>'
      : '<span class="badge ' + s.badgeClass + '">' + s.badge + '</span>';
    const numLabel = concluido ? "✓" : s.num;
    const btnBlock = concluido ? '' : '<div class="btn-row">' + s.botoes + '</div>';
    return [
      '<div class="step">',
      '<div class="step-num ' + nClass + '">' + numLabel + '</div>',
      '<div class="step-card ' + cClass + '">',
      '<div class="card-top"><div class="card-title ' + tClass + '">' + s.titulo + '</div>' + bHTML + '</div>',
      '<p class="card-desc">' + s.desc + '</p>',
      s.alerta,
      btnBlock,
      '</div></div>'
    ].join('');
  }).join('');

  document.getElementById('conteudo').innerHTML = [
    '<div class="hero"><div class="hero-bg"></div><div class="hero-grid"></div>',
    '<div class="hero-inner">',
    '<div class="hero-topbar">',
    '<div class="logo-wrap"><img src="https://sejamirae.com/wp-content/themes/mirae/images/logo-mirae.svg" alt="Mirae" height="28"></div>',
    '<div class="tag-journey"><div class="tag-dot"></div><span class="tag-label">Credenciamento Ativo</span></div>',
    '</div>',
    '<div class="hero-greeting">Dr(a).</div>',
    '<div class="hero-name">' + nome + ',</div>',
    '<div class="hero-subtitle">seja bem-vindo(a) ao Mirae MedAct.</div>',
    '<p class="hero-desc">Sua jornada de integração à rede <strong>dr.consulta</strong> foi iniciada com foco em <strong>agilidade e excelência</strong>. Acompanhe cada etapa abaixo e conte com nosso suporte dedicado.</p>',
    '</div><div class="hero-rule"></div></div>',

    '<div class="quote-strip"><p class="quote-txt">A Mirae é o seu parceiro estratégico nesta jornada. Enquanto o processo oficial é conduzido pelo dr.consulta, nós monitoramos cada etapa para assegurar sua prioridade e suporte.</p></div>',

    '<div class="progress-section">',
    '<div class="section-eyebrow">Progresso Atual</div>',
    '<div class="progress-head"><div class="progress-title">Status da Jornada</div><div class="progress-badge">Etapa ' + etapa + ' de 5</div></div>',
    '<div class="seg-track">' + segs + '</div>',
    '<div class="seg-labels"><span class="seg-pct">Início</span><span class="seg-pct">' + pct + '% concluído</span></div>',
    '</div>',

    '<div class="steps-section">',
    '<div class="steps-header">As 5 Etapas de Ativação</div>',
    '<div class="timeline"><div class="tl-line"></div>' + stepsHTML + '</div>',
    '</div>',

    '<div class="cta-section"><div class="cta-inner">',
    '<div class="cta-eyebrow">Suporte Dedicado</div>',
    '<div class="cta-title">Precisa de ajuda prioritária?</div>',
    '<p class="cta-desc">Nossa equipe de gestão acompanha você individualmente para garantir velocidade e resolução de qualquer pendência técnica.</p>',
    '<a href="' + wa("5511915161138", "Olá, preciso de ajuda com minha jornada de ativação. Médico: " + nome) + '" class="btn-wa">',
    '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>',
    'Falar com alguém da Mirae</a>',
    '</div></div>',

    '<div class="footer">',
    '<img src="https://sejamirae.com/wp-content/themes/mirae/images/logo-mirae.svg" alt="Mirae" height="22" style="display:block;">',
    '<div class="footer-tagline">Impulsionando resultados e qualidade assistencial.</div>',
    '</div>'
  ].join('');

  document.getElementById('loading').style.display = 'none';
  document.getElementById('conteudo').style.display = 'block';
}

function erro(msg) {
  document.getElementById('loading').innerHTML =
    '<p style="font-family:sans-serif;padding:40px;color:#3D6470;">' + msg + '</p>';
}

// Pega o ?id= da URL
const params = new URLSearchParams(window.location.search);
const id = params.get('id');

if (!id) {
  erro('Link inválido. Solicite um novo link à equipe Mirae.');
} else {
  fetch(SCRIPT_URL + '?id=' + encodeURIComponent(id) + '&formato=json')
    .then(function(r){ return r.json(); })
    .then(function(data){
      if (data.erro) {
